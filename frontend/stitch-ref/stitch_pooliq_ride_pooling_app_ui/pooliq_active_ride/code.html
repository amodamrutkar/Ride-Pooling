<script>
  // Subtle Vehicle Tracking Simulation along Waypoints
  (function initVehicleTelemetry() {
    const marker = document.getElementById('vehicle-marker');
    if (!marker) return;

    const coordinates = [
      { x: 145, y: 220 },
      { x: 145, y: 175 },
      { x: 145, y: 130 },
      { x: 190, y: 115 },
      { x: 235, y: 115 }
    ];

    let step = 0;
    setInterval(() => {
      step = (step + 1) % coordinates.length;
      marker.style.left = coordinates[step].x + 'px';
      marker.style.top = coordinates[step].y + 'px';
    }, 2800);

    const cancelBtn = document.getElementById('cancel-btn');
    if (cancelBtn) {
      cancelBtn.addEventListener('click', () => {
        if (cancelBtn.innerText === 'Cancel Ride') {
          cancelBtn.innerText = 'Confirm Cancellation?';
          cancelBtn.className = 'w-full py-3 rounded-lg bg-error-container text-on-error-container font-body-md text-body-md font-medium text-center transition-all select-none';
          setTimeout(() => {
            if (cancelBtn.innerText === 'Confirm Cancellation?') {
              cancelBtn.innerText = 'Cancel Ride';
              cancelBtn.className = 'w-full py-3 rounded-lg bg-primary hover:bg-primary-fixed-dim active:bg-primary-container text-on-primary font-body-md text-body-md font-medium text-center transition-all select-none';
            }
          }, 3500);
        } else {
          cancelBtn.innerText = 'Ride Aborted';
          cancelBtn.disabled = true;
          cancelBtn.className = 'w-full py-3 rounded-lg bg-surface-container-high text-outline font-body-md text-body-md font-medium text-center select-none cursor-not-allowed';
        }
      });
    }
  })();
